name: c_brasil_executor
description: Editor e executor multiplataforma da linguagem C Brasil, em Dart e Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^12.0.0
  shared_preferences: ^2.3.3
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/branding/logo-mark.png
