<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>C Brasil</title>
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000000;
    }

    #cbr-loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000000;
      transition: opacity 180ms ease;
    }

    #cbr-loading .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #cbr-loading img {
      width: 52px;
      height: 52px;
    }

    #cbr-loading span {
      color: #F5F5F5;
      font: 600 18px Inter, "Segoe UI", Roboto, Arial, sans-serif;
      letter-spacing: -0.2px;
    }

    body.cbr-ready #cbr-loading {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="cbr-loading" aria-hidden="true">
    <div class="brand">
      <img src="assets/assets/branding/logo.png" alt="">
      <span>C Brasil</span>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('cbr-ready');
      window.setTimeout(function () {
        document.getElementById('cbr-loading')?.remove();
      }, 240);
    });
  </script>
</body>
</html>
