name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analisar, testar e conferir a linguagem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Analisar código
        run: python3 tool/ci/analyze.py

      - name: Testes do interpretador e da interface
        run: python3 tool/ci/test.py

      - name: Conformidade com o compilador oficial
        run: bash tool/conformance/verify_upstream.sh

      - name: Build web
        run: flutter build web --release
