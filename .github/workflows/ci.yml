name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test Cbr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart files
        run: dart format lib test

      - name: Analyze
        shell: bash
        run: |
          set +e
          dart analyze --format=machine lib test > /tmp/analyzer-machine.txt 2>&1
          result=$?
          cat /tmp/analyzer-machine.txt
          python3 - <<'PY'
          from pathlib import Path
          import os
          import urllib.parse

          for line in Path('/tmp/analyzer-machine.txt').read_text(errors='replace').splitlines():
              fields = line.split('|', 7)
              if len(fields) < 8 or fields[0] not in {'ERROR', 'WARNING'}:
                  continue
              location = fields[3]
              if location.startswith('file:'):
                  location = urllib.parse.urlparse(location).path
              if os.path.isabs(location):
                  location = os.path.relpath(location, os.getcwd())
              severity = 'error' if fields[0] == 'ERROR' else 'warning'
              message = fields[7].replace('%', '%25').replace(chr(13), ' ').replace(chr(10), ' ')
              print(f'::{severity} file={location},line={fields[4]},col={fields[5]}::{message}')
          PY
          exit "$result"

      - name: Build Vercel web output
        run: bash tool/build_vercel_web.sh

      - name: Test interpreter
        shell: bash
        run: |
          set +e
          flutter test --no-pub --reporter json > /tmp/flutter-test.jsonl 2>&1
          result=$?
          cat /tmp/flutter-test.jsonl
          python3 - <<'PY'
          from pathlib import Path
          import json

          names = {}
          prints = {}
          events = []
          for line in Path('/tmp/flutter-test.jsonl').read_text(errors='replace').splitlines():
              try:
                  event = json.loads(line)
              except json.JSONDecodeError:
                  continue
              events.append(event)
              test = event.get('test') or {}
              if event.get('type') == 'testStart':
                  names[test.get('id')] = test.get('name', 'Cbr test')
              test_id = event.get('testID', event.get('testId'))
              if event.get('type') == 'print' and test_id is not None:
                  prints.setdefault(test_id, []).append(event.get('message', ''))

          for event in events:
              if event.get('type') != 'error':
                  continue
              test_id = event.get('testID', event.get('testId'))
              name = names.get(test_id, 'Cbr test')
              detail = event.get('error', 'Test failed')
              stack = event.get('stackTrace', '')
              diagnostics = chr(10).join(prints.get(test_id, []))
              message = f'{name}: {detail} {stack}{chr(10)}{diagnostics}'
              if len(message) > 3500:
                  message = message[:1800] + chr(10) + '…' + chr(10) + message[-1600:]
              message = message.replace('%', '%25').replace(chr(13), ' ').replace(chr(10), '%0A')
              print(f'::error title={name}::{message}')
          PY
          exit "$result"
