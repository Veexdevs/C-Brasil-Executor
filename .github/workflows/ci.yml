name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analisar, testar e conferir a linguagem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Analisar código
        run: python3 tool/ci/analyze.py

      - name: Testes do interpretador e da interface
        run: python3 tool/ci/test.py

      - name: Conformidade com o compilador oficial
        run: bash tool/conformance/verify_upstream.sh

      - name: Build web
        run: flutter build web --release

  scaffold:
    name: Gerar runners nativos
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[scaffold]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter create
        run: |
          set -euo pipefail
          rm -rf /tmp/scaffold && mkdir -p /tmp/scaffold
          cd /tmp/scaffold
          flutter create \
            --project-name c_brasil_executor \
            --org br.com.cbrasil \
            --platforms=android,ios,linux,macos,windows \
            app
          cd "$GITHUB_WORKSPACE"
          for dir in android ios linux macos windows; do
            rm -rf "$dir"
            mkdir -p "$dir"
            cp -a "/tmp/scaffold/app/$dir/." "$dir/"
          done

      - name: Commitar runners
        run: |
          set -euo pipefail
          git config user.name "C Brasil Bot"
          git config user.email "cbr-bot@users.noreply.github.com"
          git add android ios linux macos windows
          if git diff --cached --quiet; then
            echo "Nada para commitar."
            exit 0
          fi
          git commit -m "chore: gerar runners nativos com flutter create"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  goldens:
    name: Atualizar saídas oficiais
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[goldens]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compilar o compilador oficial e regravar as saídas
        run: CBR_UPDATE_GOLDENS=1 bash tool/conformance/verify_upstream.sh

      - name: Commitar golden files
        run: |
          set -euo pipefail
          git config user.name "C Brasil Bot"
          git config user.email "cbr-bot@users.noreply.github.com"
          git add test/conformance/expected
          if git diff --cached --quiet; then
            echo "Já estava atualizado."
            exit 0
          fi
          git commit -m "test: atualizar saídas oficiais do compilador Cbr"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  format:
    name: Formatar código
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[format]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: dart format
        run: dart format lib test tool

      - name: Commitar formatação
        run: |
          set -euo pipefail
          git config user.name "C Brasil Bot"
          git config user.email "cbr-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Já estava formatado."
            exit 0
          fi
          git commit -m "style: aplicar dart format"
          git push origin "HEAD:${GITHUB_REF_NAME}"
