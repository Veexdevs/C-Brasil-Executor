name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test Cbr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart files
        run: dart format lib test

      - name: Analyze
        shell: bash
        run: |
          set +e
          dart analyze --format=machine lib test > /tmp/analyzer-machine.txt 2>&1
          result=$?
          cat /tmp/analyzer-machine.txt
          python3 - <<'PY'
          from pathlib import Path
          import os
          import urllib.parse

          for line in Path('/tmp/analyzer-machine.txt').read_text(errors='replace').splitlines():
              fields = line.split('|', 7)
              if len(fields) < 8 or fields[0] not in {'ERROR', 'WARNING'}:
                  continue
              location = fields[3]
              if location.startswith('file:'):
                  location = urllib.parse.urlparse(location).path
              if os.path.isabs(location):
                  location = os.path.relpath(location, os.getcwd())
              severity = 'error' if fields[0] == 'ERROR' else 'warning'
              message = fields[7].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::{severity} file={location},line={fields[4]},col={fields[5]}::{message}')
          PY
          exit "$result"

      - name: Test interpreter
        run: flutter test --no-pub
